<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AvoidRain - 3D Endless Runner</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./src/styles/main.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #87CEEB;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
  </style>
  <!-- Import Map per Three.js - necessario per GitHub Pages senza bundler -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.168.0/build/three.module.js"
    }
  }
  </script>
  <!-- Game Jam Widget -->
  <script async src="https://jam.pieter.com/2026/widget.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- UI Overlay -->
  <div id="ui-overlay">
    <!-- HUD -->
    <div class="hud-container">
      <!-- Wet Meter -->
      <div class="wet-meter-container">
        <div class="wet-meter-label">WETNESS</div>
        <div class="wet-meter-bar-container">
          <div id="wet-meter-bar" class="wet-meter-bar"></div>
          <span id="wet-meter-text" class="wet-meter-text">0%</span>
        </div>
      </div>

      <!-- Timer and Score -->
      <div class="stats-container">
        <div class="stat-box">
          <div class="stat-label">Time</div>
          <div id="timer" class="stat-value">00:00</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Score</div>
          <div id="score" class="stat-value">0</div>
        </div>
        <div id="notification" class="notification"></div>
      </div>
    </div>

    <!-- Menu Screen -->
    <div id="menu-screen" class="menu-screen">
      <div class="menu-content">
        <h1 class="menu-title">AVOID RAIN</h1>
        <p class="menu-subtitle">Endless Urban Runner</p>
        <p class="menu-tagline">Don't get soaked!</p>
        <div class="menu-instructions">
          <p>🏃 Use A/D or Arrow Keys to move</p>
          <p>☔ Find shelter under balconies</p>
        </div>
        <p class="menu-hint">Press ENTER to Start</p>
      </div>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="menu-screen" style="display: none;">
      <div class="menu-content">
        <h1 class="menu-title">GAME OVER</h1>
        <p class="menu-subtitle">You got too wet!</p>
        <div class="game-over-score">Score: <span id="game-over-score">0</span></div>
        <p class="menu-hint">Press ENTER to Restart</p>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
